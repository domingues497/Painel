<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rack de switches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@500;600&display=swap">
<link rel="stylesheet" href="/static/ui.css">
<style>
:root{--plate-top:#3a424d;--plate-bottom:#2a3038;--link-off:#2a3a31;--activity-off:#4a3a1c}
.rack{position:relative;display:block;width:100%;min-height:180px;max-width:1040px;padding:14px;overflow:visible}
.plate{fill:url(#plate);stroke:var(--edge)}.ear{fill:#232a32;stroke:var(--edge)}.screw{fill:#11151a;stroke:#59636f}
.silk{fill:#aab4c0;font:500 10px var(--font-head);text-anchor:middle}.brand{fill:#c5ced8;font:600 14px var(--font-head);letter-spacing:.08em}.model{fill:#8a96a5;font:500 11px var(--font-head);letter-spacing:.06em}
.jack{fill:var(--jack);stroke:var(--edge);stroke-width:1}.socket{fill:#07090b}.led-link{fill:var(--link-off)}.led-act{fill:var(--activity-off)}
.port.up .jack{stroke:#3c7a52}.port.up .led-link{fill:var(--link-on);filter:drop-shadow(0 0 2px var(--link-on))}
.port.down .led-link{fill:var(--link-down);opacity:.55}.port.unknown .jack{stroke-dasharray:3 2}
.port.act-1 .led-act,.port.act-2 .led-act,.port.act-3 .led-act{fill:var(--activity);filter:drop-shadow(0 0 2px var(--activity));animation:blink var(--d) step-end infinite}
.port.act-1{--d:1.6s}.port.act-2{--d:.8s}.port.act-3{--d:.3s}
@keyframes blink{0%,49.99%{opacity:1}50%,100%{opacity:.15}}
</style>
</head>
<body>
<div class="top">
  <h1>Rack de switches</h1>
  <nav class="nav" aria-label="Painéis">
    <a href="/" aria-current="page">Switches</a>
    <a href="/hosts.html?view=servers">Servidores</a>
    <a href="/hosts.html?view=workstations">Computadores</a>
    <a href="/hosts.html?view=all">Todos os hosts</a>
    <a href="/rede.html">Rede</a>
    <a class="admin-only" href="/executivo.html">Executivo</a>
    <a class="admin-only" href="/configuracao.html">Configuração</a>
  </nav>
  <span class="summary" id="summary"></span>
  <div class="layout-actions"><span class="updated" id="updated"></span><button class="layout-edit-toggle" id="layout-edit-toggle" type="button" aria-pressed="false">Editar painel</button></div>
</div>
<p class="banner" id="banner" hidden></p>
<main class="rack" id="rack" aria-live="polite"></main>

<script src="/static/no-overlap.js"></script>
<script src="/static/edit-ux.js"></script>
<script>
const REFRESH_MS = 15000;
// Faixas de tráfego (entrada + saída, em bits/s) que definem a velocidade do LED de atividade.
const TIERS = [[1e7, 3], [1e6, 2], [1e4, 1]];

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

// Posição das 28 portas do CRS328-24P-4S+RM: números ímpares em cima, pares embaixo.
function portLayout() {
  const ports = [];
  for (let n = 1; n <= 24; n++) {
    const col = (n - 1) >> 1, row = (n - 1) & 1;
    ports.push({ key: `ether${n}`, label: String(n), x: 70 + col * 46 + Math.floor(col / 4) * 14, y: row ? 72 : 34, w: 34, h: 28, row });
  }
  for (let s = 1; s <= 4; s++) {
    const col = (s - 1) >> 1, row = (s - 1) & 1;
    ports.push({ key: `sfp-sfpplus${s}`, label: `S${s}`, x: 690 + col * 60, y: row ? 72 : 34, w: 52, h: 28, row });
  }
  return ports;
}
const LAYOUT = portLayout();

function fmtBps(v) {
  if (v >= 1e9) return (v / 1e9).toFixed(2) + " Gbit/s";
  if (v >= 1e6) return (v / 1e6).toFixed(1) + " Mbit/s";
  if (v >= 1e3) return (v / 1e3).toFixed(0) + " kbit/s";
  return Math.round(v) + " bit/s";
}

function buildSwitch(host) {
  const card = document.createElement("section");
  card.className = "switch";
  const head = document.createElement("header");
  const h2 = document.createElement("h2"); h2.textContent = host;
  const counts = document.createElement("p"); counts.className = "counts";
  head.append(h2, counts);
  card.appendChild(head);

  const svg = el("svg", { viewBox: "0 0 960 122", role: "img", "aria-label": `Painel frontal do switch ${host}` });
  const defs = el("defs", {}, svg);
  const grad = el("linearGradient", { id: "plate", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: "0", "stop-color": "var(--plate-top)" }, grad);
  el("stop", { offset: "1", "stop-color": "var(--plate-bottom)" }, grad);

  el("rect", { class: "plate", x: 20, y: 2, width: 920, height: 118, rx: 3 }, svg);
  el("rect", { class: "ear", x: 0, y: 2, width: 30, height: 118, rx: 3 }, svg);
  el("rect", { class: "ear", x: 930, y: 2, width: 30, height: 118, rx: 3 }, svg);
  for (const [cx, cy] of [[15, 20], [15, 102], [945, 20], [945, 102]]) el("circle", { class: "screw", cx, cy, r: 5 }, svg);

  const brand = el("text", { class: "brand", x: 830, y: 58 }, svg); brand.textContent = "MikroTik";
  const model = el("text", { class: "model", x: 830, y: 76 }, svg); model.textContent = "CRS328-24P-4S+RM";

  const nodes = {};
  for (const p of LAYOUT) {
    const g = el("g", { class: "port unknown" }, svg);
    const title = el("title", {}, g);
    el("rect", { class: "jack", x: p.x, y: p.y, width: p.w, height: p.h, rx: 2 }, g);
    el("rect", { class: "socket", x: p.x + 4, y: p.y + 11, width: p.w - 8, height: p.h - 15, rx: 1 }, g);
    el("circle", { class: "led-link", cx: p.x + 9, cy: p.y + 6, r: 3 }, g);
    el("circle", { class: "led-act", cx: p.x + p.w - 9, cy: p.y + 6, r: 3 }, g);
    const t = el("text", { class: "silk", x: p.x + p.w / 2, y: p.row ? p.y + p.h + 11 : p.y - 5 }, svg);
    t.textContent = p.label;
    nodes[p.key] = { g, title };
  }
  card.appendChild(svg);
  return { card, counts, nodes };
}

function activityTier(bps) {
  for (const [limit, tier] of TIERS) if (bps >= limit) return tier;
  return 0;
}

function updateSwitch(view, sw) {
  let up = 0, down = 0;
  for (const p of LAYOUT) {
    const data = sw.ports[p.key];
    const { g, title } = view.nodes[p.key];
    let state = "unknown", act = 0, tip = `${p.key}: sem dados`;
    if (data && data.status !== null) {
      const total = data.in_bps + data.out_bps;
      if (data.status === 1) { state = "up"; up++; act = activityTier(total); }
      else { state = "down"; down++; }
      tip = `${p.key}: ${state === "up" ? "ativa" : "inativa"}` +
            (state === "up" ? `\nRecebendo ${fmtBps(data.in_bps)}\nEnviando ${fmtBps(data.out_bps)}` : "");
    }
    g.setAttribute("class", `port ${state}` + (act ? ` act-${act}` : ""));
    title.textContent = tip;
  }
  view.counts.textContent = `${up} ativas, ${down} inativas`;
  return { up, down };
}

let views = {};
let lastOk = null;

function render(data) {
  const rack = document.getElementById("rack");
  const names = data.switches.map(s => s.host);
  if (names.join("|") !== Object.keys(views).join("|")) {
    rack.replaceChildren();
    views = {};
    if (!names.length) {
      const p = document.createElement("p"); p.className = "empty";
      p.textContent = "Nenhum switch encontrado. Confira os nomes em SWITCH_HOSTS.";
      rack.appendChild(p);
    }
    for (const n of names) { views[n] = buildSwitch(n); rack.appendChild(views[n].card); }
  }
  let up = 0, down = 0;
  for (const sw of data.switches) { const r = updateSwitch(views[sw.host], sw); up += r.up; down += r.down; }
  freeCardLayout(rack, ".switch", "switches", { minWidth: 420, minHeight: 130, widthFor: (card, available) => Math.max(420, Math.min(960, available - 28)), heightFor: () => 150 });
  document.getElementById("summary").textContent = `${names.length} switches, ${up} portas ativas, ${down} inativas`;
  const banner = document.getElementById("banner");
  banner.hidden = !data.mock;
  if (data.mock) banner.textContent = "Dados de demonstração. Defina ZABBIX_URL e ZABBIX_TOKEN para ver os switches reais.";
}

/* Edição de layout: mover/redimensionar e alterar leituras só ficam liberados ao clicar em Editar painel. */
function isPanelLayoutEditing() { return document.body.classList.contains("layout-edit-active"); }
function setupPanelEditMode() {
  const button = document.getElementById("layout-edit-toggle");
  if (!button || button.dataset.bound) return;
  button.dataset.bound = "1";
  let restoreButton = document.getElementById("restore-hidden-cards");
  if (!restoreButton) {
    restoreButton = document.createElement("button");
    restoreButton.id = "restore-hidden-cards";
    restoreButton.type = "button";
    restoreButton.className = "layout-edit-toggle";
    restoreButton.textContent = "Restaurar cards excluídos";
    restoreButton.title = "Restaurar todos os cards ocultados nesta página";
    restoreButton.hidden = true;
    button.insertAdjacentElement("afterend", restoreButton);
    restoreButton.addEventListener("click", () => {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (key && key.startsWith("painel-hidden-cards:")) localStorage.removeItem(key);
      }
      window.location.reload();
    });
  }
  const setMode = enabled => {
    restoreButton.hidden = !enabled;
    document.body.classList.toggle("layout-edit-active", enabled);
    button.setAttribute("aria-pressed", String(enabled));
    button.textContent = enabled ? "Concluir edição" : "Editar painel";
    button.title = enabled ? "Salvar o layout e sair do modo de edição" : "Liberar ajustes de layout e configuração dos itens Zabbix";
    document.querySelectorAll(".free-card-managed").forEach(card => {
      card.style.resize = enabled ? "both" : "none";
      card.querySelectorAll(":scope > header, :scope > h3, :scope > .label").forEach(handle => { handle.style.cursor = enabled ? "grab" : "default"; });
    });
    document.querySelectorAll(".rank").forEach(card => { card.style.resize = enabled ? "both" : "none"; });
    document.querySelectorAll(".rank-head").forEach(handle => { handle.style.cursor = enabled ? "grab" : "default"; handle.style.touchAction = enabled ? "none" : "auto"; });
    if (!enabled) {
      document.querySelectorAll(".rank-config").forEach(config => { config.hidden = true; });
      document.querySelectorAll(".rank-menu-btn").forEach(menu => menu.setAttribute("aria-expanded", "false"));
      document.querySelectorAll(".free-alignment-guide").forEach(guide => { guide.style.display = "none"; });
    }
    window.dispatchEvent(new CustomEvent("panel-layout-edit-change", { detail: { enabled } }));
  };
  button.addEventListener("click", () => setMode(!isPanelLayoutEditing()));
  setMode(false);
}
setupPanelEditMode();

let panelDataRevision = 0;
// Pausa atualizações automáticas enquanto o usuário edita o layout. A mudança
// de revisão invalida qualquer resposta HTTP que já estivesse em andamento.
window.addEventListener("panel-layout-edit-change", event => {
  panelDataRevision += 1;
  if (!event.detail?.enabled) refresh();
});

function ensureFreeAlignmentGuides(parent) {
  let vertical = parent.querySelector(":scope > .free-alignment-guide.vertical");
  let horizontal = parent.querySelector(":scope > .free-alignment-guide.horizontal");
  if (!vertical) { vertical = document.createElement("div"); vertical.className = "free-alignment-guide vertical"; vertical.setAttribute("aria-hidden", "true"); parent.appendChild(vertical); }
  if (!horizontal) { horizontal = document.createElement("div"); horizontal.className = "free-alignment-guide horizontal"; horizontal.setAttribute("aria-hidden", "true"); parent.appendChild(horizontal); }
  return { vertical, horizontal };
}

/* Layout livre comum: cartões podem ser movidos e redimensionados com o mouse.
   Cada área salva suas coordenadas no navegador e restaura-as após a atualização. */
function freeCardLayout(parentOrSelector, selector, storageName, options = {}) {
  const parent = typeof parentOrSelector === "string" ? document.querySelector(parentOrSelector) : parentOrSelector;
  if (!parent) return;
  const cards = [...parent.querySelectorAll(`:scope > ${selector}`)];
  if (!cards.length) return;
  const gap = options.gap ?? 14;
  const baseMinW = options.minWidth ?? 220;
  // Largura mínima efetiva: a grade "N por linha" pode reduzi-la (guardado por grupo) para caber mais cards por linha.
  try { parent._freeMinW = Number(localStorage.getItem(`painel-card-minw:${storageName}`)) || 0; } catch { parent._freeMinW = 0; }
  const minW = () => Math.min(baseMinW, parent._freeMinW || baseMinW);
  const minH = options.minHeight ?? 110;
  const available = Math.max(320, parent.clientWidth || (window.innerWidth - 80));
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(`painel-free-cards:${storageName}`) || "{}") || {}; } catch {}
  let hiddenCards = [];
  try { hiddenCards = JSON.parse(localStorage.getItem(`painel-hidden-cards:${storageName}`) || "[]") || []; } catch {}
  for (const card of cards) {
    const titleNode = card.querySelector(":scope > header h2, :scope > h2, :scope > h3, :scope > .label, :scope > span, h2, h3, .label");
    const title = card.dataset.freeOrigTitle || (titleNode?.textContent || card.className || "card").trim().replace(/\s+/g, " ").slice(0, 140);
    const key = `${[...card.classList].filter(c => !["online", "offline", "unknown", "moving", "free-card-moving"].includes(c)).sort().join(".")}:${title}`;
    if (hiddenCards.includes(key)) card.style.display = "none";
  }
  const visibleCards = cards.filter(card => card.style.display !== "none");
  if (!visibleCards.length) {
    parent.style.position = "relative"; parent.style.minHeight = "40px";
    parent.dataset.freeStorageName = storageName;
    return;
  }
  parent.style.position = "relative";
  parent.style.display = "block";
  parent.style.width = "100%";
  parent.style.minHeight = `${minH}px`;
  parent.style.overflow = "visible";

  // Título exibido pode ser personalizado pelo usuário; a CHAVE de layout usa sempre o título original
  // (dataset.freeOrigTitle), para que renomear nunca perca posição/tamanho salvos.
  const titleNodeFor = card => [
    card.querySelector(":scope > header h2"), card.querySelector(":scope > h2"),
    card.querySelector(":scope > h3"), card.querySelector(":scope > .label"),
    card.querySelector(":scope > span"), card.querySelector("h2"), card.querySelector("h3"),
    card.querySelector(".label")
  ].find(n => n && n.textContent.trim());
  const titleFor = card => card.dataset.freeOrigTitle ||
    (titleNodeFor(card)?.textContent || card.className || "card").trim().replace(/\s+/g, " ").slice(0, 140);
  const nameStore = `painel-card-names:${storageName}`;
  const readNames = () => { try { return JSON.parse(localStorage.getItem(nameStore) || "{}") || {}; } catch { return {}; } };
  const writeName = (key, value) => {
    const names = readNames(); if (value) names[key] = value; else delete names[key];
    try { localStorage.setItem(nameStore, JSON.stringify(names)); } catch {}
  };
  const applyCustomName = (card, key) => {
    const name = readNames()[key], node = titleNodeFor(card);
    if (!name || !node) return;
    if (!card.dataset.freeOrigTitle) card.dataset.freeOrigTitle = titleFor(card);
    node.textContent = name;
  };
  // Edição inline do nome: Enter/clique fora salva, Esc cancela, vazio restaura o nome original.
  const startRename = card => {
    const node = titleNodeFor(card);
    if (!node || node.querySelector("input")) return;
    const key = card.dataset.freeCardKey, shown = node.textContent.trim(), orig = card.dataset.freeOrigTitle || shown;
    const input = document.createElement("input");
    input.type = "text"; input.className = "free-card-name-input"; input.value = shown; input.maxLength = 60;
    input.setAttribute("aria-label", "Nome do card (deixe vazio para restaurar o original)");
    node.textContent = ""; node.appendChild(input); input.focus(); input.select();
    let finished = false;
    const finish = save => {
      if (finished) return; finished = true;
      const value = input.value.trim().replace(/\s+/g, " ");
      if (!save) { node.textContent = shown; return; }
      if (!value || value === orig) { writeName(key, ""); delete card.dataset.freeOrigTitle; node.textContent = orig; }
      else { writeName(key, value); card.dataset.freeOrigTitle = orig; node.textContent = value; }
    };
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); } else if (e.key === "Escape") { e.preventDefault(); finish(false); }
      e.stopPropagation();
    });
    input.addEventListener("blur", () => finish(true));
  };
  const keyFor = card => `${[...card.classList].filter(c => !["online", "offline", "unknown", "moving", "free-card-moving"].includes(c)).sort().join(".")}:${titleFor(card)}`;
  const widthFor = card => {
    if (typeof options.widthFor === "function") return Math.max(minW(), Math.min(available, options.widthFor(card, available)));
    if (card.classList.contains("stat")) return Math.min(210, Math.max(150, (available - gap * 3) / 4));
    if (card.classList.contains("switch")) return Math.max(420, Math.min(960, available - 28));
    if (card.classList.contains("rank")) return Math.max(300, Math.min(450, (available - gap) / 2));
    return Math.max(minW(), Math.min(360, available - gap));
  };
  const heightFor = card => {
    if (typeof options.heightFor === "function") return options.heightFor(card);
    if (card.classList.contains("stat")) return 86;
    if (card.classList.contains("switch")) return 175;
    if (card.classList.contains("rank")) return 220;
    if (card.classList.contains("card")) return 175;
    return 230;
  };
  const items = visibleCards.map((card, i) => {
    const key = keyFor(card);
    card.dataset.freeCardKey = key;
    applyCustomName(card, key);
    const record = saved[key] && Number.isFinite(Number(saved[key].x)) ? saved[key] : null;
    card.style.position = "absolute";
    card.style.boxSizing = "border-box";
    card.style.margin = "0";
    card.style.maxWidth = "none";
    card.style.maxHeight = "none";
    card.style.minWidth = `${minW()}px`;
    card.style.minHeight = `${minH}px`;
    card.classList.add("free-card-managed");
    card.style.resize = isPanelLayoutEditing() ? "both" : "none";
    card.style.overflow = "auto";
    card.style.touchAction = "auto";
    card.style.width = `${Math.max(minW(), Number(record?.w) || widthFor(card))}px`;
    card.style.height = record?.h ? `${Math.max(minH, Number(record.h))}px` : "auto";
    card.style.left = `${Math.max(0, Number(record?.x) || 0)}px`;
    card.style.top = `${Math.max(0, Number(record?.y) || 0)}px`;
    card.style.zIndex = String(Number(record?.z) || (100 + i));
    card.style.cursor = "default";
    return { card, key, record, index: i };
  });

  const anySaved = items.some(x => x.record);
  if (!anySaved) {
    let x = 0, y = 0, rowHeight = 0;
    for (const item of items) {
      const w = widthFor(item.card);
      item.card.style.width = `${w}px`;
      item.card.style.height = "auto";
      if (x > 0 && x + w > available) { x = 0; y += rowHeight + gap; rowHeight = 0; }
      item.card.style.left = `${x}px`; item.card.style.top = `${y}px`;
      const h = Math.max(minH, item.card.offsetHeight || heightFor(item.card));
      item.card.style.height = `${h}px`;
      item.record = { x, y, w, h, z: 100 + item.index };
      rowHeight = Math.max(rowHeight, h); x += w + gap;
    }
  } else {
    let bottom = 0;
    for (const item of items) if (item.record) bottom = Math.max(bottom, Number(item.record.y || 0) + Number(item.record.h || item.card.offsetHeight || minH));
    for (const item of items) {
      if (!item.record) {
        const w = widthFor(item.card), h = Math.max(minH, item.card.offsetHeight || heightFor(item.card));
        item.record = { x: 0, y: bottom + gap, w, h, z: 100 + item.index };
        item.card.style.left = "0px"; item.card.style.top = `${item.record.y}px`;
        item.card.style.width = `${w}px`; item.card.style.height = `${h}px`;
        bottom += h + gap;
      } else if (!item.record.h) {
        item.record.h = Math.max(minH, item.card.offsetHeight || heightFor(item.card));
        item.card.style.height = `${item.record.h}px`;
      }
    }
  }

  // Anti-sobreposição (estilo Sortable): ao arrastar/redimensionar, os outros cards abrem espaço (empurrados para
  // baixo a partir da posição que tinham no início do gesto); ao soltar, o layout é compactado e preenche os vazios.
  const rectOf = card => ({ x: parseFloat(card.style.left) || 0, y: parseFloat(card.style.top) || 0, w: card.offsetWidth, h: card.offsetHeight });
  const snapshot = () => items.filter(i => i.card.style.display !== "none").map(i => ({ card: i.card, ...rectOf(i.card) }));
  let dragBase = null, resizeBase = null, ghost = null;
  const reflow = (moving, base) => {
    const others = base.filter(b => b.card !== moving);
    const pos = PanelNoOverlap.push(rectOf(moving), others);
    others.forEach((o, i) => { o.card.style.left = `${pos[i].x}px`; o.card.style.top = `${pos[i].y}px`; });
    // Espaço-fantasma: onde o card vai assentar quando for solto (após compactar).
    const mine = rectOf(moving);
    const dest = PanelNoOverlap.compact([mine, ...others.map((o, i) => ({ x: pos[i].x, y: pos[i].y, w: o.w, h: o.h }))])[0];
    if (!ghost) { ghost = document.createElement("div"); ghost.className = "free-drop-ghost"; parent.appendChild(ghost); }
    Object.assign(ghost.style, { left: `${dest.x}px`, top: `${dest.y}px`, width: `${mine.w}px`, height: `${mine.h}px` });
    resizeCanvas();
  };
  const settle = () => {
    if (window.PanelNoOverlap) {
      const list = snapshot(), pos = PanelNoOverlap.compact(list);
      list.forEach((o, i) => { o.card.style.left = `${pos[i].x}px`; o.card.style.top = `${pos[i].y}px`; });
    }
    dragBase = null; resizeBase = null; parent.classList.remove("free-reflowing");
    if (ghost) { ghost.remove(); ghost = null; }
    resizeCanvas();
  };
  // Assistente: após redimensionar um card, sugere padronizar o grupo (mesmo tamanho ou N por linha, alinhado). Com Desfazer.
  const suggestLayout = card => {
    if (!window.PanelUX?.suggestLayout || !window.PanelNoOverlap) return;
    const count = snapshot().length;
    if (count < 2) return;
    const size = { w: Math.round(card.offsetWidth), h: Math.round(card.offsetHeight) };
    const width = parent.clientWidth || available;
    const cwFor = n => Math.floor((width - gap * (n - 1)) / n);
    const minKey = `painel-card-minw:${storageName}`;
    const apply = (build, undoExtra) => {
      const list = snapshot();
      const prev = list.map(o => ({ card: o.card, left: o.card.style.left, top: o.card.style.top, width: o.card.style.width, height: o.card.style.height }));
      build(list).forEach((r, i) => {
        const el = list[i].card;
        el.style.left = `${r.x}px`; el.style.top = `${r.y}px`; el.style.width = `${r.w}px`; el.style.height = `${r.h}px`;
      });
      settle(); persist(); resizeCanvas();
      PanelUX.toast(`Layout aplicado a ${count} cards`, { action: "Desfazer", onAction: () => {
        if (undoExtra) undoExtra();
        prev.forEach(p => Object.assign(p.card.style, { left: p.left, top: p.top, width: p.width, height: p.height }));
        settle(); persist(); resizeCanvas();
      } });
    };
    PanelUX.suggestLayout({
      count, sizeLabel: `${size.w}×${size.h}`,
      maxPerRow: count,
      tightFrom: (() => { for (let n = 1; n <= count; n++) if (cwFor(n) < baseMinW) return n; return Infinity; })(),
      minOk: n => cwFor(n) >= 80,
      onSameSize: () => apply(list => {
        const sized = list.map(o => ({ x: o.x, y: o.y, w: size.w, h: size.h }));
        const pos = PanelNoOverlap.flow(sized, width);
        return sized.map((o, i) => ({ x: pos[i].x, y: pos[i].y, w: size.w, h: size.h }));
      }),
      onGrid: n => {
        // Se a coluna ficar mais estreita que o mínimo padrão, reduz o mínimo do grupo (e guarda) para o layout não sobrepor.
        const prevMin = parent._freeMinW || 0, setMin = v => {
          parent._freeMinW = v;
          try { v ? localStorage.setItem(minKey, String(v)) : localStorage.removeItem(minKey); } catch {}
          snapshot().forEach(o => { o.card.style.minWidth = `${minW()}px`; });
        };
        setMin(cwFor(n) < baseMinW ? cwFor(n) : 0);
        apply(list => PanelNoOverlap.gridLayout(list, n, width, gap), () => setMin(prevMin));
      }
    });
  };
  if (window.PanelNoOverlap) {
    // Layout salvo/inicial com cards sobrepostos é reorganizado ao abrir (empurra para baixo).
    const placed = [];
    [...items].sort((a, b) => rectOf(a.card).y - rectOf(b.card).y || rectOf(a.card).x - rectOf(b.card).x).forEach(({ card }) => {
      const r = rectOf(card), f = PanelNoOverlap.resolve(r, placed, available);
      card.style.left = `${f.x}px`; card.style.top = `${f.y}px`;
      placed.push({ x: f.x, y: f.y, w: r.w, h: r.h });
    });
  }
  let maxZ = Math.max(100, ...items.map(x => Number(x.record?.z) || 100));
  const persist = () => {
    const out = {};
    for (const { card, key } of items) out[key] = {
      x: Math.max(0, Math.round(parseFloat(card.style.left) || 0)),
      y: Math.max(0, Math.round(parseFloat(card.style.top) || 0)),
      w: Math.max(minW(), Math.round(card.offsetWidth)),
      h: Math.max(minH, Math.round(card.offsetHeight)),
      z: Number(card.style.zIndex) || 100
    };
    try { localStorage.setItem(`painel-free-cards:${storageName}`, JSON.stringify({ ...saved, ...out })); } catch {}
  };
  if (parent._freeCardLayoutContext) parent._freeCardLayoutContext.persist = persist;
  const resizeCanvas = () => {
    let bottom = 0;
    for (const {card} of items) bottom = Math.max(bottom, (parseFloat(card.style.top) || 0) + card.offsetHeight);
    parent.style.height = `${Math.max(minH, bottom + gap)}px`;
  };
  const guides = ensureFreeAlignmentGuides(parent);
  const hideGuides = () => { guides.vertical.style.display = "none"; guides.horizontal.style.display = "none"; };
  if (parent._freeCardLayoutContext) { parent._freeCardLayoutContext.items = items; parent._freeCardLayoutContext.hideGuides = hideGuides; parent._freeCardLayoutContext.resizeCanvas = resizeCanvas; }
  const nearestSnap = (position, size, targets) => {
    const points = [position, position + size / 2, position + size];
    let best = null;
    for (const point of points) for (const target of targets) {
      const delta = target - point, distance = Math.abs(delta);
      if (distance <= 8 && (!best || distance < best.distance)) best = { delta, target, distance };
    }
    return best;
  };
  const snapFreePosition = (card, left, top) => {
    const others = items.filter(item => item.card !== card).map(({card: other}) => ({
      x: parseFloat(other.style.left) || 0, y: parseFloat(other.style.top) || 0,
      w: other.offsetWidth, h: other.offsetHeight
    }));
    const xTargets = others.flatMap(o => [o.x, o.x + o.w / 2, o.x + o.w]);
    const yTargets = others.flatMap(o => [o.y, o.y + o.h / 2, o.y + o.h]);
    const sx = nearestSnap(left, card.offsetWidth, xTargets);
    const sy = nearestSnap(top, card.offsetHeight, yTargets);
    if (sx) { left += sx.delta; guides.vertical.style.left = `${sx.target}px`; guides.vertical.style.display = "block"; }
    else guides.vertical.style.display = "none";
    if (sy) { top += sy.delta; guides.horizontal.style.top = `${sy.target}px`; guides.horizontal.style.display = "block"; }
    else guides.horizontal.style.display = "none";
    return { x: Math.max(0, left), y: Math.max(0, top) };
  };
  const snapFreeSize = card => {
    if (!isPanelLayoutEditing() || card.dataset.freeResizing !== "1") return;
    const left = parseFloat(card.style.left) || 0, top = parseFloat(card.style.top) || 0;
    const others = items.filter(item => item.card !== card).map(({card: other}) => ({
      x: parseFloat(other.style.left) || 0, y: parseFloat(other.style.top) || 0,
      w: other.offsetWidth, h: other.offsetHeight
    }));
    const xTargets = others.flatMap(o => [o.x, o.x + o.w / 2, o.x + o.w]);
    const yTargets = others.flatMap(o => [o.y, o.y + o.h / 2, o.y + o.h]);
    const snapEdge = (edge, targets, origin, minSize) => {
      let best = null;
      for (const target of targets) { const d = Math.abs(target - edge); if (d <= 8 && target - origin >= minSize && (!best || d < best.distance)) best = { target, distance: d }; }
      return best;
    };
    const sx = snapEdge(left + card.offsetWidth, xTargets, left, minW());
    const sy = snapEdge(top + card.offsetHeight, yTargets, top, minH);
    if (sx) { const w = sx.target - left; if (Math.abs(card.offsetWidth - w) > 1) card.style.width = `${w}px`; guides.vertical.style.left = `${sx.target}px`; guides.vertical.style.display = "block"; }
    else guides.vertical.style.display = "none";
    if (sy) { const h = sy.target - top; if (Math.abs(card.offsetHeight - h) > 1) card.style.height = `${h}px`; guides.horizontal.style.top = `${sy.target}px`; guides.horizontal.style.display = "block"; }
    else guides.horizontal.style.display = "none";
  };
  parent._freeCardLayoutContext = { items, persist, resizeCanvas, hideGuides, settle, suggest: suggestLayout };
  if (!parent.dataset.freeLayoutPointerUpBound) {
    parent.dataset.freeLayoutPointerUpBound = "1";
    const finishResize = () => {
      const ctx = parent._freeCardLayoutContext;
      if (!ctx) return;
      let changed = false, resized = null;
      for (const {card} of ctx.items) if (card.dataset.freeResizing === "1") {
        delete card.dataset.freeResizing; changed = true;
        const s0 = card._startSize;
        if (s0 && (Math.abs(s0.w - card.offsetWidth) > 2 || Math.abs(s0.h - card.offsetHeight) > 2)) resized = card;
      }
      if (changed) {
        ctx.hideGuides(); if (ctx.settle) ctx.settle(); if (ctx.persist) ctx.persist(); ctx.resizeCanvas();
        if (resized && ctx.suggest) ctx.suggest(resized);
      }
    };
    document.addEventListener("pointerup", finishResize);
    document.addEventListener("pointercancel", finishResize);
  }
  for (const { card, key } of items) {
    if (!card.querySelector(".free-card-grip")) {
      const grip = document.createElement("button");
      grip.type = "button"; grip.className = "free-card-grip"; grip.textContent = "⠿";
      grip.title = "Arrastar cartão"; grip.setAttribute("aria-label", `Mover ${titleFor(card)}`);
      card.appendChild(grip);
    }
    if (!card.querySelector(".free-card-delete")) {
      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "free-card-delete";
      removeButton.textContent = "×";
      removeButton.title = `Excluir card: ${titleFor(card)}`;
      removeButton.setAttribute("aria-label", `Excluir card ${titleFor(card)}`);
      card.appendChild(removeButton);
      removeButton.addEventListener("click", event => {
        event.preventDefault(); event.stopPropagation();
        if (!isPanelLayoutEditing()) return;
        const title = (titleNodeFor(card)?.textContent || titleFor(card)).trim();
        if (!window.PanelUX && !window.confirm(`Excluir o card "${title}" deste painel? Você poderá restaurá-lo pelo botão Restaurar cards excluídos.`)) return;
        const store = `painel-hidden-cards:${storageName}`;
        const readHidden = () => { try { return JSON.parse(localStorage.getItem(store) || "[]") || []; } catch { return []; } };
        const hidden = readHidden();
        if (!hidden.includes(key)) hidden.push(key);
        localStorage.setItem(store, JSON.stringify(hidden));
        card.style.display = "none";
        settle(); persist(); resizeCanvas();   // os demais sobem e fecham o vazio
        if (window.PanelUX) PanelUX.toast(`Card "${title}" excluído`, { action: "Desfazer", onAction: () => {
          localStorage.setItem(store, JSON.stringify(readHidden().filter(k => k !== key)));
          card.style.display = "";
          if (window.PanelNoOverlap) reflow(card, snapshot());   // devolve o card e abre espaço
          settle(); persist(); resizeCanvas();
        } });
      });
    }
    if (!card.querySelector(".free-card-rename")) {
      const renameButton = document.createElement("button");
      renameButton.type = "button"; renameButton.className = "free-card-rename"; renameButton.textContent = "✎";
      renameButton.title = `Renomear card: ${titleFor(card)}`;
      renameButton.setAttribute("aria-label", `Renomear card ${titleFor(card)}`);
      card.appendChild(renameButton);
      renameButton.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); if (isPanelLayoutEditing()) startRename(card); });
    }
    const nameNode = titleNodeFor(card);
    if (nameNode && !nameNode.dataset.renameBound) {
      nameNode.dataset.renameBound = "1";
      nameNode.addEventListener("dblclick", e => { if (isPanelLayoutEditing() && !e.target.closest("input")) { e.preventDefault(); startRename(card); } });
    }
    let tools = card.querySelector(":scope > .free-card-tools");
    if (!tools) { tools = document.createElement("div"); tools.className = "free-card-tools"; card.appendChild(tools); }
    for (const cls of [".free-card-rename", ".free-card-grip", ".free-card-delete"]) {
      const control = card.querySelector(cls);
      if (control && control.parentElement !== tools) tools.appendChild(control);
    }
    const dragHandles = [card.querySelector(".free-card-grip"), card.querySelector(":scope > header"), card.querySelector(":scope > h3"), card.querySelector(":scope > .label")].filter(Boolean);
    if (!card.dataset.freeDragBound) {
      card.dataset.freeDragBound = "1";
      for (const handle of dragHandles) {
        handle.style.cursor = isPanelLayoutEditing() ? "grab" : "default";
        handle.style.userSelect = "none";
        handle.addEventListener("pointerdown", e => {
          if (!isPanelLayoutEditing() || e.button !== 0 || e.target.closest("input,select,textarea,a,button:not(.free-card-grip)")) return;
          const start = { x: e.clientX, y: e.clientY, left: parseFloat(card.style.left) || 0, top: parseFloat(card.style.top) || 0, pointerId: e.pointerId };
          card.style.zIndex = String(++maxZ); card.classList.add("free-card-moving");
          if (window.PanelNoOverlap) { dragBase = snapshot(); parent.classList.add("free-reflowing"); }
          e.preventDefault();
          const move = ev => {
            if (ev.pointerId !== start.pointerId) return;
            const snapped = snapFreePosition(card, Math.max(0, start.left + ev.clientX - start.x), Math.max(0, start.top + ev.clientY - start.y));
            card.style.left = `${snapped.x}px`;
            card.style.top = `${snapped.y}px`;
            if (window.PanelNoOverlap && dragBase) reflow(card, dragBase);
            resizeCanvas();
          };
          const finish = ev => {
            if (ev.pointerId !== start.pointerId) return;
            document.removeEventListener("pointermove", move);
            document.removeEventListener("pointerup", finish);
            document.removeEventListener("pointercancel", finish);
            card.classList.remove("free-card-moving");
            settle();
            hideGuides(); persist(); resizeCanvas();
          };
          document.addEventListener("pointermove", move);
          document.addEventListener("pointerup", finish);
          document.addEventListener("pointercancel", finish);
        });
      }
    }
    if (!card.dataset.freeResizeDetectBound) {
      card.dataset.freeResizeDetectBound = "1";
      card.addEventListener("pointerdown", e => {
        if (!isPanelLayoutEditing()) return;
        const rect = card.getBoundingClientRect();
        if (e.clientX >= rect.right - 22 && e.clientY >= rect.bottom - 22) { card.dataset.freeResizing = "1"; card._startSize = { w: card.offsetWidth, h: card.offsetHeight }; if (window.PanelNoOverlap) { resizeBase = snapshot(); parent.classList.add("free-reflowing"); } }
      });
    }
    if (!card._freeCardResizeObserver && typeof ResizeObserver !== "undefined") {
      card._freeCardResizeObserver = new ResizeObserver(() => {
        if (!card.isConnected) return;
        snapFreeSize(card);
        if (window.PanelNoOverlap && isPanelLayoutEditing() && resizeBase && card.dataset.freeResizing === "1") reflow(card, resizeBase);
        resizeCanvas();
        clearTimeout(card._freeSaveTimer);
        card._freeSaveTimer = setTimeout(persist, 150);
      });
      card._freeCardResizeObserver.observe(card);
    }
  }
  resizeCanvas();
  persist();
}

async function refresh() {
  if (isPanelLayoutEditing()) return;
  const revision = panelDataRevision;
  const banner = document.getElementById("banner");
  try {
    const res = await fetch("/api/switches");
    if (isPanelLayoutEditing() || revision !== panelDataRevision) return;
    if (!res.ok) throw new Error((await res.json()).detail || res.status);
    const data = await res.json();
    if (isPanelLayoutEditing() || revision !== panelDataRevision) return;
    render(data);
    lastOk = new Date(data.updated);
    document.getElementById("updated").textContent = "Atualizado às " + lastOk.toLocaleTimeString("pt-BR");
  } catch (err) {
    if (isPanelLayoutEditing() || revision !== panelDataRevision) return;
    banner.hidden = false;
    banner.textContent = `${err.message || err}. ` + (lastOk ? `Mostrando os dados das ${lastOk.toLocaleTimeString("pt-BR")}.` : "");
  }
}
refresh();
setInterval(refresh, REFRESH_MS);
</script>
<script src="/static/admin-nav.js"></script></body>
</html>
